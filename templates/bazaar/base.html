<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bookzy AI - Smart Book Marketplace & AI Reader Recommendations{% endblock %}</title>

    <!-- Google AdSense Verification Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2089287900015421"
         crossorigin="anonymous"></script>

    <!-- Modern Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN with Blue & White Design System -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#0f172a',
                        },
                        royal: {
                            50: '#f0f7ff',
                            100: '#e0f2fe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                            900: '#0f172a',
                        },
                        // Remap pakistan to modern Royal Blue palette for full backwards-compatible theme overhaul
                        pakistan: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        jazz: '#b91c1c',
                        easy: '#0284c7'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Urgent Fix: Force column flex direction on main and inner containers */
        main,
        #app-shell,
        #app-wrapper,
        #phone-frame,
        .app-content {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }
        main section,
        #app-shell section,
        #app-wrapper section,
        #phone-frame section,
        section.tab-page,
        .shelf-section {
            width: 100% !important;
            max-width: 1200px !important;
            margin-left: auto !important;
            margin-right: auto !important;
            box-sizing: border-box !important;
            display: flex !important;
            flex-direction: column !important;
        }
        section.tab-page.hidden,
        .tab-page.hidden,
        .hidden {
            display: none !important;
        }

        /* Enforce hiding bottom mobile navigation bar on desktop screens (>= 768px) */
        @media (min-width: 768px) {
            #mobile-bottom-nav,
            .mobile-bottom-nav {
                display: none !important;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] antialiased min-h-screen flex flex-col font-sans selection:bg-blue-600 selection:text-white">

    {% block content %}
    {% endblock %}

    <script src="/static/js/app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
