<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="45%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="natureGlow" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#forestGrad)"/>

  <!-- Ornate Border -->
  <rect x="14" y="14" width="372" height="532" rx="12" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.7"/>
  <rect x="22" y="22" width="356" height="516" rx="8" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.4"/>

  <!-- Nature Glow Circle -->
  <circle cx="200" cy="180" r="130" fill="url(#natureGlow)"/>

  <!-- Top Badge -->
  <g filter="url(#shadow)">
    <rect x="45" y="38" width="310" height="30" rx="15" fill="url(#goldBanner)"/>
    <text x="200" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#064E3B" text-anchor="middle" letter-spacing="0.8">
      ★ TIMELESS MORAL FABLES FOR CHILDREN · AGE 5–12 ★
    </text>
  </g>

  <!-- Central Illustrated Artwork: Cute Tortoise & Hare Racing under a Sunny Tree -->
  <g transform="translate(200, 180)" filter="url(#shadow)">
    <!-- Sun & Clouds -->
    <circle cx="70" cy="-65" r="26" fill="#FDE047"/>
    <ellipse cx="-60" cy="-60" rx="28" ry="14" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="-45" cy="-68" rx="20" ry="15" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Big Sunny Tree Foliage -->
    <circle cx="0" cy="-35" r="50" fill="#10B981" opacity="0.85"/>
    <circle cx="-35" cy="-25" r="38" fill="#047857" opacity="0.9"/>
    <circle cx="35" cy="-25" r="38" fill="#34D399" opacity="0.9"/>
    <rect x="-8" y="-10" width="16" height="55" rx="4" fill="#78350F"/>

    <!-- Grassy Mound -->
    <ellipse cx="0" cy="52" rx="100" ry="24" fill="#065F46"/>
    <ellipse cx="0" cy="46" rx="90" ry="18" fill="#10B981"/>

    <!-- Cute Smiling Tortoise (Leading with Winner Ribbon) -->
    <g transform="translate(-36, 32)">
      <!-- Tortoise Shell -->
      <path d="M-22,8 C-22,-14 22,-14 22,8 Z" fill="#D97706"/>
      <path d="M-18,6 C-18,-10 18,-10 18,6 Z" fill="#F59E0B"/>
      <!-- Shell Pattern Hexagons -->
      <polygon points="0,-6 -6,0 0,6 6,0" fill="#B45309"/>
      <circle cx="-8" cy="-2" r="3" fill="#B45309"/>
      <circle cx="8" cy="-2" r="3" fill="#B45309"/>
      <!-- Head -->
      <ellipse cx="-26" cy="3" rx="8" ry="6" fill="#34D399"/>
      <circle cx="-28" cy="1" r="1.5" fill="#064E3B"/>
      <path d="M-28,5 Q -25,7 -22,5" stroke="#064E3B" stroke-width="1" fill="none"/>
      <!-- Feet -->
      <ellipse cx="-16" cy="10" rx="5" ry="4" fill="#34D399"/>
      <ellipse cx="14" cy="10" rx="5" ry="4" fill="#34D399"/>
      <!-- Little 1st Place Ribbon -->
      <circle cx="16" cy="-4" r="5" fill="#DC2626"/>
      <polygon points="16,-2 13,8 19,8" fill="#DC2626"/>
    </g>

    <!-- Playful Cartoon Hare (Rabbit running / surprised) -->
    <g transform="translate(38, 22)">
      <!-- Rabbit Body -->
      <ellipse cx="0" cy="8" rx="14" ry="10" fill="#FFFFFF"/>
      <!-- Head -->
      <circle cx="12" cy="0" r="10" fill="#FFFFFF"/>
      <!-- Long Ears -->
      <ellipse cx="14" cy="-15" rx="4" ry="12" fill="#FFFFFF" transform="rotate(10, 14, -15)"/>
      <ellipse cx="14" cy="-15" rx="2" ry="8" fill="#F472B6" transform="rotate(10, 14, -15)"/>
      <ellipse cx="8" cy="-14" rx="4" ry="11" fill="#FFFFFF" transform="rotate(-15, 8, -14)"/>
      <ellipse cx="8" cy="-14" rx="2" ry="7" fill="#F472B6" transform="rotate(-15, 8, -14)"/>
      <!-- Eye & Cheerful Expression -->
      <circle cx="14" cy="-2" r="2" fill="#1E293B"/>
      <circle cx="15" cy="-3" r="0.7" fill="#FFFFFF"/>
      <!-- Pink Nose -->
      <circle cx="20" cy="1" r="1.5" fill="#F43F5E"/>
      <!-- Fluffy Tail -->
      <circle cx="-14" cy="6" r="4" fill="#FFFFFF"/>
      <!-- Running Paws -->
      <ellipse cx="-4" cy="16" rx="5" ry="3" fill="#FFFFFF"/>
      <ellipse cx="10" cy="16" rx="6" ry="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Urdu Nastaliq Banner -->
  <rect x="40" y="295" width="320" height="38" rx="10" fill="#064E3B" opacity="0.9"/>
  <text x="200" y="322" font-family="'Jameel Noori Nastaleeq', 'Urdu Typesetting', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FDE047" text-anchor="middle">
    ایسوپ کی دلکش اخلاقی کہانیاں (بچوں کے لیے)
  </text>

  <!-- Main Title -->
  <text x="200" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5" filter="url(#shadow)">
    AESOP'S FABLES
  </text>
  <text x="200" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#A7F3D0" text-anchor="middle" letter-spacing="0.5">
    Illustrated for Young Readers
  </text>
  <text x="200" y="430" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ECFDF5" text-anchor="middle">
    The Tortoise &amp; Hare · The Boy Who Cried Wolf · Lion &amp; Mouse
  </text>

  <!-- Divider -->
  <line x1="80" y1="448" x2="320" y2="448" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Details -->
  <text x="200" y="475" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Classic Character-Building Stories &amp; Moral Wisdom
  </text>
  <text x="200" y="495" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#D1FAE5" text-anchor="middle">
    Full-Color Artwork &amp; Easy English-Urdu Vocabulary
  </text>

  <!-- Bottom Publisher Seal -->
  <g transform="translate(200, 526)">
    <rect x="-85" y="-14" width="170" height="22" rx="11" fill="#047857"/>
    <text x="0" y="2" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="0.8">
      OXFORD CHILDREN CLASSICS
    </text>
  </g>
</svg>
