<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lampGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#nightGrad)"/>

  <!-- Ornate Arabian Arch Border -->
  <rect x="14" y="14" width="372" height="532" rx="12" fill="none" stroke="#FDE047" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <rect x="22" y="22" width="356" height="516" rx="8" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.4"/>

  <!-- Magical Night Glow -->
  <circle cx="200" cy="180" r="130" fill="url(#lampGlow)"/>

  <!-- Top Badge -->
  <g filter="url(#shadow)">
    <rect x="55" y="38" width="290" height="30" rx="15" fill="url(#lampGold)"/>
    <text x="200" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#451A03" text-anchor="middle" letter-spacing="0.8">
      ★ CLASSIC ARABIAN NIGHTS TALES · AGE 5–12 ★
    </text>
  </g>

  <!-- Central Illustrated Artwork: Golden Genie Lamp, Magic Smoke, Crescent Moon & Stars -->
  <g transform="translate(200, 175)" filter="url(#shadow)">
    <!-- Crescent Moon & Star -->
    <path d="M-60,-80 A 30 30 0 0 0 -20,-105 A 38 38 0 0 1 -60,-80 Z" fill="#FDE047"/>
    <polygon points="-12,-96 -9,-86 1,-86 -7,-80 -4,-70 -12,-76 -20,-70 -17,-80 -25,-86 -15,-86" fill="#FFFFFF"/>

    <!-- Distant Mosque/Palace Dome Silhouette -->
    <path d="M-90,30 Q -65,-5 -40,30 L-40,40 L-90,40 Z" fill="#1E1B4B" opacity="0.7"/>
    <path d="M40,30 Q 65,-5 90,30 L90,40 L40,40 Z" fill="#1E1B4B" opacity="0.7"/>
    <path d="M-65,-12 L-65,-5" stroke="#FDE047" stroke-width="2"/>
    <path d="M65,-12 L65,-5" stroke="#FDE047" stroke-width="2"/>

    <!-- Magical Whimsical Blue/Violet Genie Smoke Swirl -->
    <path d="M-35,5 Q -55,-25 -20,-45 Q 15,-65 -10,-85 Q 30,-80 40,-50 Q 50,-20 0,-15 Q -15,-10 -35,5" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M-28,8 Q -42,-18 -12,-38 Q 18,-55 -2,-75" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Floating Magic Flying Carpet -->
    <g transform="translate(50, -50) rotate(-15)">
      <path d="M-30,-8 Q 0,-15 30,-8 Q 0,0 -30,-8 Z" fill="#E11D48"/>
      <path d="M-28,-7 L28,-7" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="3,2"/>
    </g>

    <!-- Golden Genie Magic Lamp -->
    <!-- Base -->
    <ellipse cx="0" cy="38" rx="28" ry="8" fill="#B45309"/>
    <ellipse cx="0" cy="36" rx="24" ry="6" fill="#F59E0B"/>
    <path d="M-14,35 L-10,22 L10,22 L14,35 Z" fill="#D97706"/>
    <!-- Lamp Body (Teardrop Boat) -->
    <path d="M-45,15 Q -40,32 0,32 Q 40,32 45,15 Q 20,4 -20,4 Z" fill="url(#lampGold)"/>
    <!-- Spout Extends to the Left -->
    <path d="M-40,12 C-55,10 -65,-4 -45,-12 C-38,-6 -30,6 -35,12 Z" fill="url(#lampGold)"/>
    <!-- Spout Flame/Glow -->
    <circle cx="-42" cy="-8" r="6" fill="#FEF08A"/>
    <circle cx="-42" cy="-8" r="3" fill="#FFFFFF"/>
    <!-- Lamp Lid with Finial -->
    <ellipse cx="0" cy="5" rx="16" ry="6" fill="#FDE047"/>
    <circle cx="0" cy="0" r="4" fill="#B45309"/>
    <!-- Lamp Handle on the Right -->
    <path d="M35,15 C55,8 55,-12 35,-4 C28,0 26,10 32,15" fill="none" stroke="url(#lampGold)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Urdu Nastaliq Banner -->
  <rect x="40" y="295" width="320" height="38" rx="10" fill="#0F172A" opacity="0.85"/>
  <text x="200" y="322" font-family="'Jameel Noori Nastaleeq', 'Urdu Typesetting', Arial, sans-serif" font-size="22" font-weight="bold" fill="#FDE047" text-anchor="middle">
    الف لیلیٰ : بچوں کے لیے تصویری کہانیاں
  </text>

  <!-- Main Title -->
  <text x="200" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1" filter="url(#shadow)">
    ALIF LAILA
  </text>
  <text x="200" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="0.5">
    Illustrated Stories for Children
  </text>
  <text x="200" y="430" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E0E7FF" text-anchor="middle">
    Aladdin &amp; Magic Lamp · Ali Baba · Sinbad the Sailor
  </text>

  <!-- Divider -->
  <line x1="80" y1="448" x2="320" y2="448" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Details -->
  <text x="200" y="475" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Classic Eastern Tales of Wonder &amp; Magic
  </text>
  <text x="200" y="495" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#C7D2FE" text-anchor="middle">
    Easy Vocabulary &amp; Colorful Illustrations for Young Readers
  </text>

  <!-- Bottom Publisher Seal -->
  <g transform="translate(200, 526)">
    <rect x="-85" y="-14" width="170" height="22" rx="11" fill="#312E81"/>
    <text x="0" y="2" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="0.8">
      ILLUSTRATED GIFT EDITION
    </text>
  </g>
</svg>
