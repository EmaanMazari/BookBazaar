# ========================================================
# BookBazaar Pakistan - Production Nginx Configuration
# Path: /etc/nginx/sites-available/bookbazaar
# ========================================================

# Upstream Gunicorn socket
upstream bookbazaar_app {
    server unix:/run/bookbazaar.sock fail_timeout=0;
}

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bookbazaar.pk www.bookbazaar.pk;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bookbazaar.pk www.bookbazaar.pk;

    # SSL Certificate & Private Key (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/bookbazaar.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookbazaar.pk/privkey.pem;

    # TLS Protocols & Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size (5MB listing images)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Files (Whitenoise / Nginx Direct)
    location /static/ {
        alias /var/www/bookbazaar/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Files (User-uploaded listing & profile images)
    location /media/ {
        alias /var/www/bookbazaar/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Proxy to Django Gunicorn WSGI
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        # Keepalive & Buffer settings
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;

        proxy_pass http://bookbazaar_app;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
